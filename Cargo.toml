[package]
name = "web_serial_blinky"
version = "0.1.0"
authors = ["yuri volkov"]
edition = "2021"

[dependencies]
embedded-hal = "1.0.0"
panic-halt = "1.0.0"
portable-atomic = {version = "1.12.0", features = ["critical-section"]}
vcc-gnd-yd-rp2040 = "0.6.0"
rtic = {version = "2.2.0", features = ["thumbv6-backend"]}
rtic-monotonics = {version = "2.1.0", features = ["cortex-m-systick"]}
heapless = "0.9.2"
smart-leds = "0.4.0"
ws2812-pio = "0.9.0"
tinyrand = "0.5.0"
rtic-sync = "1.4.0"
usb-device = "0.3.2"
usbd-serial = "0.2.2"
ghostfat = {version = "0.5.0", default-features = false}
usbd_scsi = "0.1.0"
cortex-m = "0.7.7"


[patch.crates-io]
# usb-device v0.3.2
usbd_scsi = {git = "https://github.com/brrastak/stm32-usb.rs.git", branch = "master"}
# rp2040-hal v0.11.0
vcc-gnd-yd-rp2040 = {git = "https://github.com/Tommypop2/rp-hal-boards.git", branch = "main"}


[dev-dependencies]
pretty_assertions = "1.4.1"


# Set the default for dependencies.
[profile.dev.package."*"]
opt-level = "s"

[profile.release]
codegen-units = 1
incremental = false
debug = true
lto = true
opt-level = "s"
